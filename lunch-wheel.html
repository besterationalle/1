<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今天中午吃什么？</title>
<style>
:root{--bg:#f3ede4;--paper:#fbf8f2;--ink:#2d211b;--muted:#7b6a5c;--gold:#b38b4d;--wine:#7b2f29;--wine2:#9a4338}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.9),transparent 32%),linear-gradient(180deg,#f8f4ed 0%,var(--bg) 100%);color:var(--ink);min-height:100vh}.page{max-width:980px;margin:0 auto;padding:28px 18px 38px}.top{text-align:center;margin-bottom:18px}.kicker{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(32px,6vw,54px);margin:8px 0 6px}.desc{color:var(--muted);font-size:14px}.app{display:grid;gap:24px;align-items:center;background:rgba(251,248,242,.8);border:1px solid rgba(184,157,116,.26);border-radius:28px;padding:22px;box-shadow:0 24px 70px rgba(68,46,28,.09)}@media(min-width:820px){.app{grid-template-columns:minmax(0,1fr) 280px}}.wheelbox{position:relative;max-width:600px;margin:auto;aspect-ratio:1;width:100%}canvas{width:100%;height:100%;display:block}.pointer{position:absolute;left:50%;top:2px;transform:translateX(-50%);z-index:3;width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid var(--wine);filter:drop-shadow(0 4px 8px rgba(44,26,19,.22))}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:29%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fffaf3,#efe1c7);border:1px solid #d6bc8f;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 10px 26px rgba(76,50,29,.16);pointer-events:none;padding:8px}.hub small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}.hub strong{font-family:Georgia,"Times New Roman",serif;font-size:clamp(15px,3vw,22px);line-height:1.25}.panel{background:linear-gradient(180deg,#fffdf9,#f8f1e7);border:1px solid #e5d9c8;border-radius:22px;padding:18px}.label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}.result{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;min-height:72px;display:flex;align-items:center}.sub{font-size:13px;color:var(--muted);line-height:1.6}button{width:100%;min-height:48px;border-radius:14px;font-weight:700;font-size:15px;margin-top:10px;cursor:pointer}.primary{border:0;background:linear-gradient(180deg,var(--wine2),var(--wine));color:#fff;box-shadow:0 10px 22px rgba(123,47,41,.18)}.secondary,.share{border:1px solid #d9c9b2;background:transparent;color:var(--ink)}button:disabled{opacity:.55;cursor:not-allowed}.foot{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.6}.share{display:none}.share.show{display:block}
</style>
</head>
<body><main class="page"><header class="top"><div class="kicker">Lunch Selection</div><h1>今天中午吃什么？</h1><div class="desc">把选择交给转盘。转到什么，就吃什么。</div></header><section class="app"><div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="720" height="720"></canvas><div class="hub"><div><small>Chef's Choice</small><strong>转到啥<br>就吃啥</strong></div></div></div><aside class="panel"><div class="label">Today's Choice</div><div id="result" class="result" aria-live="polite">交给运气</div><div id="sub" class="sub">点击按钮，让今天的午餐少一点纠结。</div><button id="spin" class="primary" type="button">开始转盘</button><button id="again" class="secondary" type="button">再转一次</button><button id="share" class="share" type="button">分享结果</button><div class="foot">规则：除非过敏、忌口或附近完全买不到，否则不许耍赖。</div></aside></section></main>
<script>
(()=>{const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),resultEl=document.getElementById('result'),subEl=document.getElementById('sub'),spinBtn=document.getElementById('spin'),againBtn=document.getElementById('again'),shareBtn=document.getElementById('share');const items=[['盖饭','🍚','#8B3E2F'],['面条','🍜','#B45A34'],['米粉/粉面','🥣','#C98C3D'],['饺子/馄饨','🥟','#758153'],['麻辣烫/火锅','🍲','#54746C'],['炒菜配米饭','🍛','#4B6670'],['汉堡炸鸡','🍔','#6A5D78'],['轻食沙拉','🥗','#86657E'],['日料','🍣','#9A6273'],['韩餐','🍳','#A3534E'],['烧烤/串串','🍢','#9A643F'],['牛排','🥩','#734035'],['意大利面','🍝','#A8693C'],['披萨','🍕','#BC8740'],['烤肉','🔥','#7C4A3B']];const TAU=Math.PI*2,N=items.length,arc=TAU/N;let rotation=0,running=false,chosen=null;function linesFor(t){if(t==='麻辣烫/火锅')return['麻辣烫/','火锅'];if(t==='炒菜配米饭')return['炒菜','配米饭'];if(t==='汉堡炸鸡')return['汉堡','炸鸡'];if(t==='轻食沙拉')return['轻食','沙拉'];if(t==='烧烤/串串')return['烧烤/','串串'];if(t==='米粉/粉面')return['米粉/','粉面'];if(t==='饺子/馄饨')return['饺子/','馄饨'];if(t==='意大利面')return['意大利','面'];return[t]}function draw(){const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,r=w*.39;ctx.clearRect(0,0,w,h);ctx.beginPath();ctx.arc(cx,cy,r+18,0,TAU);ctx.fillStyle='#e9dcc5';ctx.fill();ctx.beginPath();ctx.arc(cx,cy,r+7,0,TAU);ctx.fillStyle='#fbf6ec';ctx.fill();ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);items.forEach((it,i)=>{const[name,icon,color]=it,a0=-Math.PI/2+i*arc,a1=a0+arc;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a0,a1);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#f5eadb';ctx.lineWidth=3;ctx.stroke();const mid=a0+arc/2;ctx.save();ctx.rotate(mid);ctx.translate(r*.72,0);ctx.rotate(Math.PI/2);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='26px system-ui';ctx.fillText(icon,0,-25);ctx.fillStyle='#fff8ef';ctx.font='700 14px system-ui,-apple-system,sans-serif';const ls=linesFor(name);if(ls.length===1)ctx.fillText(ls[0],0,12);else{ctx.fillText(ls[0],0,5);ctx.fillText(ls[1],0,22)}ctx.restore()});ctx.restore();ctx.beginPath();ctx.arc(cx,cy,r*.29,0,TAU);ctx.fillStyle='#f2e5d0';ctx.fill();ctx.strokeStyle='#d3b781';ctx.lineWidth=3;ctx.stroke()}function norm(a){a%=TAU;return a<0?a+TAU:a}function selectedIndex(){const p=-Math.PI/2,local=norm(p-rotation+Math.PI/2);return Math.floor(local/arc)%N}function finish(){rotation=norm(rotation);draw();chosen=items[selectedIndex()];resultEl.textContent=chosen[1]+' '+chosen[0];subEl.textContent='今日菜单已决定。';shareBtn.classList.add('show');running=false;spinBtn.disabled=false;againBtn.disabled=false}function spin(){if(running)return;running=true;chosen=null;shareBtn.classList.remove('show');spinBtn.disabled=true;againBtn.disabled=true;resultEl.textContent='正在决定…';subEl.textContent='主厨正在替你翻牌。';const start=rotation,target=start+(6+Math.random()*3)*TAU+Math.random()*TAU;if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){rotation=target;finish();return}const t0=performance.now(),duration=3000;function frame(t){const p=Math.min(1,(t-t0)/duration),e=1-Math.pow(1-p,4);rotation=start+(target-start)*e;draw();if(p<1)requestAnimationFrame(frame);else finish()}requestAnimationFrame(frame)}async function shareResult(){if(!chosen)return;const text='今天中午吃：'+chosen[0]+' '+chosen[1];if(navigator.share){try{await navigator.share({title:'午餐转盘',text});return}catch(e){}}alert(text)}spinBtn.addEventListener('click',spin);againBtn.addEventListener('click',spin);shareBtn.addEventListener('click',shareResult);draw()})();
</script></body></html>
