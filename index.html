<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171713">
<title>今天中午吃什么？｜午间菜单</title>
<style>
:root{--night:#171713;--night-soft:#22221d;--paper:#f3ecdc;--paper-light:#fbf7ed;--ink:#211f19;--muted:#746e60;--brass:#b99452;--brass-light:#d7bd7a;--wine:#6f2925;--wine-light:#913d34;--line:rgba(116,92,48,.24);--shadow:0 30px 90px rgba(0,0,0,.28)}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;min-height:100vh;color:var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% -10%,rgba(185,148,82,.17),transparent 38%),radial-gradient(circle at 8% 72%,rgba(111,41,37,.15),transparent 30%),linear-gradient(145deg,#1e1e19 0%,#11110f 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.21;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E")}
.page{position:relative;max-width:1180px;margin:0 auto;padding:34px 20px 46px}
.masthead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;margin-bottom:28px;color:var(--brass-light)}
.mast-line{height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
.monogram{width:48px;height:48px;border:1px solid rgba(215,189,122,.65);border-radius:50%;display:grid;place-items:center;font:italic 700 20px Georgia,serif;box-shadow:inset 0 0 0 4px rgba(185,148,82,.08)}
.top{text-align:center;max-width:700px;margin:0 auto 30px}
.kicker{display:flex;justify-content:center;align-items:center;gap:12px;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--brass-light)}
.kicker:before,.kicker:after{content:"✦";font-size:8px;letter-spacing:0}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,6.5vw,68px);font-weight:500;letter-spacing:.02em;line-height:1.06;margin:12px 0 10px;text-shadow:0 2px 26px rgba(0,0,0,.35)}
.desc{margin:0;color:rgba(243,236,220,.64);font-family:Georgia,"Times New Roman",serif;font-size:15px;letter-spacing:.12em}
.menu-card{position:relative;display:grid;gap:30px;align-items:center;padding:clamp(20px,3.4vw,42px);border:1px solid rgba(215,189,122,.33);border-radius:4px;background:linear-gradient(135deg,rgba(42,42,35,.96),rgba(25,25,21,.98));box-shadow:var(--shadow),inset 0 0 0 5px rgba(185,148,82,.045)}
.menu-card:before,.menu-card:after{content:"";position:absolute;width:40px;height:40px;pointer-events:none}
.menu-card:before{left:10px;top:10px;border-left:1px solid var(--brass);border-top:1px solid var(--brass)}
.menu-card:after{right:10px;bottom:10px;border-right:1px solid var(--brass);border-bottom:1px solid var(--brass)}
@media(min-width:900px){.menu-card{grid-template-columns:minmax(0,1fr) 330px;gap:48px}}
.wheel-stage{position:relative;display:grid;place-items:center;min-width:0;padding:16px}
.wheel-stage:before{content:"";position:absolute;width:76%;aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.65);filter:blur(38px);transform:translateY(7%)}
.wheelbox{position:relative;width:100%;max-width:640px;aspect-ratio:1}
canvas{position:relative;width:100%;height:100%;display:block;filter:drop-shadow(0 20px 24px rgba(0,0,0,.42))}
.pointer{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:4;width:42px;height:54px;background:linear-gradient(90deg,#8d6b31,#e1c77d 48%,#8a652d);clip-path:polygon(50% 100%,0 0,100% 0);filter:drop-shadow(0 6px 5px rgba(0,0,0,.5))}
.pointer:after{content:"";position:absolute;inset:5px 7px 13px;background:var(--wine);clip-path:inherit}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:27%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:var(--ink);background:radial-gradient(circle at 34% 28%,#fffdf5 0%,#ede1c8 56%,#c9a967 100%);border:2px solid #d8bd78;box-shadow:0 12px 28px rgba(0,0,0,.35),inset 0 0 0 6px rgba(255,255,255,.32);pointer-events:none}
.hub small{display:block;margin-bottom:5px;color:#866527;font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.hub strong{font:600 clamp(14px,2.7vw,22px)/1.28 Georgia,"Times New Roman",serif;letter-spacing:.04em}
.panel{position:relative;color:var(--ink);background:linear-gradient(145deg,var(--paper-light),var(--paper));border:1px solid #d1bb8c;padding:28px 25px 24px;box-shadow:0 18px 50px rgba(0,0,0,.22),inset 0 0 0 5px rgba(122,92,39,.05)}
.panel:before{content:"MENU · No. 01";display:block;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--line);color:#94753f;font:700 9px/1 system-ui,sans-serif;letter-spacing:.28em;text-align:center}
.label{font-size:10px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:#977641;margin-bottom:8px}
.result{min-height:76px;display:flex;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line);font:600 clamp(28px,4vw,38px)/1.2 Georgia,"Times New Roman",serif;letter-spacing:.02em}
.sub{min-height:62px;padding:15px 0 8px;color:var(--muted);font-family:Georgia,"Times New Roman",serif;font-size:14px;line-height:1.75}
button{position:relative;width:100%;min-height:50px;margin-top:10px;border-radius:2px;font-size:13px;font-weight:800;letter-spacing:.12em;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(1px)}
.primary{border:1px solid #52201d;color:#fff9eb;background:linear-gradient(180deg,var(--wine-light),var(--wine));box-shadow:0 10px 24px rgba(111,41,37,.24),inset 0 1px rgba(255,255,255,.14)}
.primary:hover:not(:disabled){box-shadow:0 13px 28px rgba(111,41,37,.31)}
.secondary,.share{border:1px solid #bda572;color:#443720;background:rgba(255,255,255,.18)}
.secondary:hover:not(:disabled),.share:hover:not(:disabled){background:rgba(185,148,82,.09)}
button:disabled{opacity:.5;cursor:not-allowed}
.foot{position:relative;margin-top:20px;padding-top:17px;color:#817765;font:12px/1.7 Georgia,"Times New Roman",serif;text-align:center}
.foot:before{content:"❦";position:absolute;top:-1px;left:50%;transform:translateX(-50%);padding:0 10px;color:#aa884d;background:var(--paper)}
.share{display:none}.share.show{display:block}
.closing{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:28px;color:rgba(215,189,122,.68);font:10px/1 system-ui,sans-serif;letter-spacing:.23em;text-transform:uppercase}
.closing:before,.closing:after{content:"";width:46px;height:1px;background:currentColor}
@media(max-width:600px){.page{padding:22px 12px 30px}.masthead{margin-bottom:20px}.monogram{width:40px;height:40px}.top{margin-bottom:22px}.menu-card{padding:17px 10px 24px;gap:16px}.wheel-stage{padding:5px}.panel{margin:0 7px;padding:24px 20px 21px}.pointer{width:34px;height:44px}.desc{font-size:13px;letter-spacing:.08em}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body><main class="page"><div class="masthead" aria-hidden="true"><div class="mast-line"></div><div class="monogram">L</div><div class="mast-line"></div></div><header class="top"><div class="kicker">The Luncheon Selection</div><h1>今天中午吃什么？</h1><p class="desc">午间限定 · 把选择交给今日主厨</p></header><section class="menu-card"><div class="wheel-stage"><div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="720" height="720"></canvas><div class="hub"><div><small>Chef's Choice</small><strong>转到啥<br>就吃啥</strong></div></div></div></div><aside class="panel"><div class="label">Today's Course</div><div id="result" class="result" aria-live="polite">交给运气</div><div id="sub" class="sub">请转动今日菜单，让主厨替你结束午餐前的犹豫。</div><button id="spin" class="primary" type="button">开始转盘</button><button id="again" class="secondary" type="button">再转一次</button><button id="share" class="share" type="button">分享今日菜单</button><div class="foot">除过敏、忌口或附近无法购买之外<br>今日菜单一经选定，不许耍赖。</div></aside></section><div class="closing">Bon Appétit</div></main>
<script>
(()=>{const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),resultEl=document.getElementById('result'),subEl=document.getElementById('sub'),spinBtn=document.getElementById('spin'),againBtn=document.getElementById('again'),shareBtn=document.getElementById('share');const items=[['盖饭','🍚','#79352B'],['面条','🍜','#9A4B31'],['米粉/粉面','🥣','#A87536'],['饺子/馄饨','🥟','#667044'],['麻辣烫/火锅','🍲','#46645A'],['炒菜配米饭','🍛','#3E5960'],['汉堡炸鸡','🍔','#5B5068'],['轻食沙拉','🥗','#73556E'],['日料','🍣','#855163'],['韩餐','🍳','#8D423D'],['烧烤/串串','🍢','#865535'],['牛排','🥩','#61352E'],['意大利面','🍝','#915A31'],['披萨','🍕','#A77437'],['烤肉','🔥','#6A3C32']];const TAU=Math.PI*2,N=items.length,arc=TAU/N;let rotation=0,running=false,chosen=null;function linesFor(t){if(t==='麻辣烫/火锅')return['麻辣烫/','火锅'];if(t==='炒菜配米饭')return['炒菜','配米饭'];if(t==='汉堡炸鸡')return['汉堡','炸鸡'];if(t==='轻食沙拉')return['轻食','沙拉'];if(t==='烧烤/串串')return['烧烤/','串串'];if(t==='米粉/粉面')return['米粉/','粉面'];if(t==='饺子/馄饨')return['饺子/','馄饨'];if(t==='意大利面')return['意大利','面'];return[t]}function draw(){const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,r=w*.39;ctx.clearRect(0,0,w,h);ctx.beginPath();ctx.arc(cx,cy,r+26,0,TAU);ctx.fillStyle='#7d602b';ctx.fill();ctx.beginPath();ctx.arc(cx,cy,r+20,0,TAU);ctx.fillStyle='#d5bb77';ctx.fill();ctx.beginPath();ctx.arc(cx,cy,r+12,0,TAU);ctx.fillStyle='#27251f';ctx.fill();ctx.beginPath();ctx.arc(cx,cy,r+5,0,TAU);ctx.fillStyle='#f2e7d1';ctx.fill();ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);items.forEach((it,i)=>{const[name,icon,color]=it,a0=-Math.PI/2+i*arc,a1=a0+arc;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a0,a1);ctx.closePath();ctx.fillStyle=color;ctx.fill();const glow=ctx.createRadialGradient(0,0,r*.12,0,0,r);glow.addColorStop(0,'rgba(255,255,255,.08)');glow.addColorStop(.72,'rgba(255,255,255,0)');glow.addColorStop(1,'rgba(0,0,0,.18)');ctx.fillStyle=glow;ctx.fill();ctx.strokeStyle='rgba(246,228,190,.62)';ctx.lineWidth=2;ctx.stroke();const mid=a0+arc/2;ctx.save();ctx.rotate(mid);ctx.translate(r*.72,0);ctx.rotate(Math.PI/2);ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.32)';ctx.shadowBlur=5;ctx.font='25px system-ui';ctx.fillText(icon,0,-25);ctx.fillStyle='#fff7e8';ctx.font='700 14px system-ui,-apple-system,sans-serif';const ls=linesFor(name);if(ls.length===1)ctx.fillText(ls[0],0,12);else{ctx.fillText(ls[0],0,5);ctx.fillText(ls[1],0,22)}ctx.restore()});ctx.restore();ctx.beginPath();ctx.arc(cx,cy,r*.29,0,TAU);ctx.fillStyle='#dfc992';ctx.fill();ctx.strokeStyle='#8d6b31';ctx.lineWidth=4;ctx.stroke()}function norm(a){a%=TAU;return a<0?a+TAU:a}function selectedIndex(){const p=-Math.PI/2,local=norm(p-rotation+Math.PI/2);return Math.floor(local/arc)%N}function finish(){rotation=norm(rotation);draw();chosen=items[selectedIndex()];resultEl.textContent=chosen[1]+' '+chosen[0];subEl.textContent='今日菜单已决定。';shareBtn.classList.add('show');running=false;spinBtn.disabled=false;againBtn.disabled=false}function spin(){if(running)return;running=true;chosen=null;shareBtn.classList.remove('show');spinBtn.disabled=true;againBtn.disabled=true;resultEl.textContent='正在决定…';subEl.textContent='主厨正在替你翻牌。';const start=rotation,target=start+(6+Math.random()*3)*TAU+Math.random()*TAU;if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){rotation=target;finish();return}const t0=performance.now(),duration=3000;function frame(t){const p=Math.min(1,(t-t0)/duration),e=1-Math.pow(1-p,4);rotation=start+(target-start)*e;draw();if(p<1)requestAnimationFrame(frame);else finish()}requestAnimationFrame(frame)}async function shareResult(){if(!chosen)return;const text='今天中午吃：'+chosen[0]+' '+chosen[1];if(navigator.share){try{await navigator.share({title:'午餐转盘',text});return}catch(e){}}alert(text)}spinBtn.addEventListener('click',spin);againBtn.addEventListener('click',spin);shareBtn.addEventListener('click',shareResult);draw()})();
</script></body></html>
