<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171713">
<title>今天中午吃什么？｜午间菜单</title>
<style>
:root{--night:#171713;--paper:#f3ecdc;--paper-light:#fbf7ed;--ink:#211f19;--muted:#746e60;--brass:#b99452;--brass-light:#d7bd7a;--wine:#6f2925;--wine-light:#913d34;--line:rgba(116,92,48,.24);--shadow:0 30px 90px rgba(0,0,0,.28)}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;min-height:100vh;color:var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% -10%,rgba(185,148,82,.17),transparent 38%),radial-gradient(circle at 8% 72%,rgba(111,41,37,.15),transparent 30%),linear-gradient(145deg,#1e1e19 0%,#11110f 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.19;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E")}
.page{position:relative;max-width:1180px;margin:0 auto;padding:32px 20px 44px}
.masthead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;margin-bottom:25px;color:var(--brass-light)}
.mast-line{height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
.monogram{width:48px;height:48px;border:1px solid rgba(215,189,122,.65);border-radius:50%;display:grid;place-items:center;font:italic 700 20px Georgia,serif;box-shadow:inset 0 0 0 4px rgba(185,148,82,.08)}
.top{text-align:center;max-width:700px;margin:0 auto 28px}
.kicker{display:flex;justify-content:center;align-items:center;gap:12px;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--brass-light)}
.kicker:before,.kicker:after{content:"✦";font-size:8px;letter-spacing:0}
h1{font-family:Georgia,"Songti SC","STSong",serif;font-size:clamp(38px,6.5vw,68px);font-weight:500;letter-spacing:.03em;line-height:1.06;margin:12px 0 10px;text-shadow:0 2px 26px rgba(0,0,0,.35)}
.desc{margin:0;color:rgba(243,236,220,.64);font-family:Georgia,"Songti SC","STSong",serif;font-size:15px;letter-spacing:.12em}
.menu-meta{display:flex;justify-content:center;gap:18px;margin-top:14px;color:rgba(215,189,122,.72);font-size:9px;letter-spacing:.2em;text-transform:uppercase}
.menu-meta span+span:before{content:"·";margin-right:18px}
.menu-card{position:relative;display:grid;gap:30px;align-items:center;padding:clamp(20px,3.4vw,42px);border:1px solid rgba(215,189,122,.33);border-radius:4px;background:linear-gradient(135deg,rgba(42,42,35,.97),rgba(25,25,21,.99));box-shadow:var(--shadow),inset 0 0 0 5px rgba(185,148,82,.045)}
.menu-card:before,.menu-card:after{content:"";position:absolute;width:40px;height:40px;pointer-events:none}
.menu-card:before{left:10px;top:10px;border-left:1px solid var(--brass);border-top:1px solid var(--brass)}
.menu-card:after{right:10px;bottom:10px;border-right:1px solid var(--brass);border-bottom:1px solid var(--brass)}
@media(min-width:900px){.menu-card{grid-template-columns:minmax(0,1fr) 342px;gap:48px}}
.wheel-stage{position:relative;display:grid;place-items:center;min-width:0;padding:16px}
.wheel-stage:before{content:"";position:absolute;width:76%;aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.68);filter:blur(38px);transform:translateY(8%)}
.wheelbox{position:relative;width:100%;max-width:640px;aspect-ratio:1;isolation:isolate}
canvas{position:relative;width:100%;height:100%;display:block;filter:drop-shadow(0 20px 24px rgba(0,0,0,.42))}
.pointer{position:absolute;left:50%;top:-1px;transform:translateX(-50%);z-index:5;width:42px;height:54px;background:linear-gradient(90deg,#8d6b31,#e6ce88 48%,#8a652d);clip-path:polygon(50% 100%,0 0,100% 0);filter:drop-shadow(0 6px 5px rgba(0,0,0,.5));transform-origin:50% 0}
.pointer:after{content:"";position:absolute;inset:5px 7px 13px;background:var(--wine);clip-path:inherit}
.wheelbox.is-spinning .pointer{animation:pointerPoise 1s ease-in-out infinite}
.wheelbox.has-result .pointer{animation:pointerSettle .55s cubic-bezier(.2,.8,.2,1)}
@keyframes pointerPoise{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-50%) rotate(1.3deg)}}
@keyframes pointerSettle{0%{transform:translateX(-50%) translateY(-3px)}45%{transform:translateX(-50%) translateY(2px)}100%{transform:translateX(-50%) translateY(0)}}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:27%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:var(--ink);background:radial-gradient(circle at 34% 28%,#fffdf5 0%,#ede1c8 56%,#c9a967 100%);border:2px solid #d8bd78;box-shadow:0 12px 28px rgba(0,0,0,.35),inset 0 0 0 6px rgba(255,255,255,.32);pointer-events:none}
.wheelbox.has-result .hub{animation:hubSettle .7s ease-out}
@keyframes hubSettle{0%{box-shadow:0 12px 28px rgba(0,0,0,.35),0 0 0 0 rgba(215,189,122,.36),inset 0 0 0 6px rgba(255,255,255,.32)}100%{box-shadow:0 12px 28px rgba(0,0,0,.35),0 0 0 22px rgba(215,189,122,0),inset 0 0 0 6px rgba(255,255,255,.32)}}
.hub small{display:block;margin-bottom:5px;color:#866527;font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.hub strong{font:600 clamp(14px,2.7vw,22px)/1.28 Georgia,"Songti SC","STSong",serif;letter-spacing:.05em}
.panel{position:relative;color:var(--ink);background:linear-gradient(145deg,var(--paper-light),var(--paper));border:1px solid #d1bb8c;padding:28px 25px 24px;box-shadow:0 18px 50px rgba(0,0,0,.22),inset 0 0 0 5px rgba(122,92,39,.05)}
.panel:before{content:"MENU · No. 01";display:block;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--line);color:#94753f;font:700 9px/1 system-ui,sans-serif;letter-spacing:.28em;text-align:center}
.label-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.label{font-size:10px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:#977641}
.course-no{color:#a78e61;font:italic 13px/1 Georgia,serif;opacity:.8}
.result{min-height:78px;display:flex;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line);font:600 clamp(29px,4vw,39px)/1.2 Georgia,"Songti SC","STSong",serif;letter-spacing:.035em}
.sub{min-height:88px;padding:16px 0 12px;color:var(--muted);font-family:Georgia,"Songti SC","STSong",serif;font-size:14px;line-height:1.8}
.panel.is-revealed .result{animation:resultIn .62s cubic-bezier(.2,.72,.2,1)}
.panel.is-revealed .sub{animation:copyIn .72s .06s both cubic-bezier(.2,.72,.2,1)}
@keyframes resultIn{from{opacity:0;transform:translateY(8px);letter-spacing:.08em}to{opacity:1;transform:none;letter-spacing:.035em}}
@keyframes copyIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.actions{display:grid;gap:10px}
button{position:relative;width:100%;min-height:52px;border-radius:2px;font-size:13px;font-weight:800;letter-spacing:.14em;cursor:pointer;transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .2s ease,background .2s ease,border-color .2s ease}
button:hover:not(:disabled){transform:translateY(-2px)}
button:active:not(:disabled){transform:translateY(1px) scale(.995)}
.primary{border:1px solid #52201d;color:#fff9eb;background:linear-gradient(180deg,var(--wine-light),var(--wine));box-shadow:0 10px 24px rgba(111,41,37,.24),inset 0 1px rgba(255,255,255,.14)}
.primary:hover:not(:disabled){box-shadow:0 14px 30px rgba(111,41,37,.33),inset 0 1px rgba(255,255,255,.18);background:linear-gradient(180deg,#9b463c,#722a26)}
.share{display:none;border:1px solid #bda572;color:#443720;background:rgba(255,255,255,.18)}
.share.show{display:block;animation:shareIn .35s ease-out}
.share:hover:not(:disabled){background:rgba(185,148,82,.09);border-color:#a9884d}
@keyframes shareIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
button:disabled{opacity:.53;cursor:not-allowed}
.foot{position:relative;margin-top:20px;padding-top:17px;color:#817765;font:12px/1.7 Georgia,"Songti SC","STSong",serif;text-align:center}
.foot:before{content:"❦";position:absolute;top:-1px;left:50%;transform:translateX(-50%);padding:0 10px;color:#aa884d;background:var(--paper)}
.closing{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:28px;color:rgba(215,189,122,.68);font:10px/1 system-ui,sans-serif;letter-spacing:.23em;text-transform:uppercase}
.closing:before,.closing:after{content:"";width:46px;height:1px;background:currentColor}
@media(max-width:600px){.page{padding:22px 12px 30px}.masthead{margin-bottom:18px}.monogram{width:40px;height:40px}.top{margin-bottom:21px}.menu-meta{gap:10px}.menu-meta span+span:before{margin-right:10px}.menu-card{padding:17px 10px 24px;gap:14px}.wheel-stage{padding:4px}.panel{margin:0 7px;padding:24px 20px 21px}.pointer{width:34px;height:44px}.desc{font-size:13px;letter-spacing:.08em}.sub{min-height:78px}}
@media(prefers-reduced-motion:reduce){button{transition:none}.wheelbox.is-spinning .pointer,.wheelbox.has-result .pointer,.wheelbox.has-result .hub,.panel.is-revealed .result,.panel.is-revealed .sub,.share.show{animation:none}}
</style>
</head>
<body>
<main class="page">
  <div class="masthead" aria-hidden="true"><div class="mast-line"></div><div class="monogram">L</div><div class="mast-line"></div></div>
  <header class="top">
    <div class="kicker">The Luncheon Selection</div>
    <h1>今天中午吃什么？</h1>
    <p class="desc">午间限定 · 把选择交给今日主厨</p>
    <div class="menu-meta" aria-hidden="true"><span>15 道候选</span><span>每日随机</span><span>不许反悔</span></div>
  </header>
  <section class="menu-card">
    <div class="wheel-stage">
      <div id="wheelbox" class="wheelbox">
        <div class="pointer"></div>
        <canvas id="wheel" width="900" height="900" aria-label="包含十五种午餐选项的随机转盘"></canvas>
        <div class="hub"><div><small>Chef's Choice</small><strong>转到什么<br>就吃什么</strong></div></div>
      </div>
    </div>
    <aside id="panel" class="panel">
      <div class="label-row"><div class="label">Today's Course</div><div id="courseNo" class="course-no">—</div></div>
      <div id="result" class="result" aria-live="polite">交给运气</div>
      <div id="sub" class="sub">请转动今日菜单，让主厨替你结束午餐前的犹豫。</div>
      <div class="actions">
        <button id="spin" class="primary" type="button">开始转盘</button>
        <button id="share" class="share" type="button">分享今日菜单</button>
      </div>
      <div class="foot">除过敏、忌口或附近无法购买之外<br>今日菜单一经选定，不许耍赖。</div>
    </aside>
  </section>
  <div class="closing">Bon Appétit</div>
</main>
<script>
(()=>{
  const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),wheelbox=document.getElementById('wheelbox'),panel=document.getElementById('panel'),resultEl=document.getElementById('result'),subEl=document.getElementById('sub'),courseNoEl=document.getElementById('courseNo'),spinBtn=document.getElementById('spin'),shareBtn=document.getElementById('share');
  const items=[
    ['盖饭','rice','#79352B','一碗装下荤素与体面，效率派也可以吃得很讲究。'],
    ['面条','noodles','#9A4B31','把烦恼交给汤底，剩下的只管一口一口理顺。'],
    ['米粉/粉面','pho','#A87536','轻盈上桌，认真入味，是午后不拖沓的选择。'],
    ['饺子/馄饨','dumpling','#667044','小小一只包得很周全，比今天的日程更有条理。'],
    ['麻辣烫/火锅','hotpot','#46645A','当生活需要一点热度时，这一锅通常不会让你失望。'],
    ['炒菜配米饭','plate','#3E5960','熟悉的搭配最懂分寸，米饭负责接住所有好味道。'],
    ['汉堡炸鸡','burger','#5B5068','偶尔允许自己直接一点，酥脆就是今天的餐桌礼仪。'],
    ['轻食沙拉','salad','#73556E','清爽得很有主见，也给下午留一点从容。'],
    ['日料','sushi','#855163','克制、精巧、刚刚好——连午休都显得更有秩序。'],
    ['韩餐','skillet','#8D423D','热气与酱香很会活跃气氛，一个人吃也像开了席。'],
    ['烧烤/串串','skewers','#865535','一串接一串，严肃的决定可以留到吃完以后。'],
    ['牛排','steak','#61352E','简单、直接、有排面，像今天不想解释太多的你。'],
    ['意大利面','pasta','#915A31','优雅地卷起来，然后假装今天一直都很从容。'],
    ['披萨','pizza','#A77437','圆满、可靠，几乎没有社交压力的一餐。'],
    ['烤肉','grill','#6A3C32','自己动手才更香，顺便把烦恼一起烤掉。']
  ];
  const TAU=Math.PI*2,N=items.length,arc=TAU/N,layer=document.createElement('canvas'),layerCtx=layer.getContext('2d');
  layer.width=canvas.width;layer.height=canvas.height;
  let rotation=0,running=false,chosen=null,hasSpun=false;

  function linesFor(t){if(t==='麻辣烫/火锅')return['麻辣烫','火锅'];if(t==='炒菜配米饭')return['炒菜','配米饭'];if(t==='汉堡炸鸡')return['汉堡','炸鸡'];if(t==='轻食沙拉')return['轻食','沙拉'];if(t==='烧烤/串串')return['烧烤','串串'];if(t==='米粉/粉面')return['米粉','粉面'];if(t==='饺子/馄饨')return['饺子','馄饨'];if(t==='意大利面')return['意大利','面'];return[t]}
  function norm(a){a%=TAU;return a<0?a+TAU:a}
  function selectedIndex(){const p=-Math.PI/2,local=norm(p-rotation+Math.PI/2);return Math.floor(local/arc)%N}
  function roundedRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}
  function drawIcon(c,type,x,y,size){
    c.save();c.translate(x,y);c.scale(size/32,size/32);c.strokeStyle='#fff5df';c.fillStyle='rgba(255,245,223,.08)';c.lineWidth=1.7;c.lineCap='round';c.lineJoin='round';c.shadowColor='rgba(0,0,0,.24)';c.shadowBlur=3;
    const bowl=()=>{c.beginPath();c.moveTo(-12,1);c.quadraticCurveTo(-10,13,0,14);c.quadraticCurveTo(10,13,12,1);c.stroke();c.beginPath();c.moveTo(-13,1);c.lineTo(13,1);c.stroke()};
    switch(type){
      case'rice':bowl();c.beginPath();c.arc(-6,0,5,Math.PI,TAU);c.arc(0,-1,6,Math.PI,TAU);c.arc(7,0,5,Math.PI,TAU);c.stroke();break;
      case'noodles':bowl();c.beginPath();c.moveTo(-7,-12);c.lineTo(-5,1);c.moveTo(0,-13);c.lineTo(0,1);c.moveTo(7,-11);c.lineTo(5,1);c.moveTo(-11,-14);c.lineTo(10,-8);c.moveTo(-9,-17);c.lineTo(12,-11);c.stroke();break;
      case'pho':bowl();c.beginPath();c.moveTo(-6,-3);c.bezierCurveTo(-10,-8,-3,-10,-6,-15);c.moveTo(2,-3);c.bezierCurveTo(-2,-8,5,-10,2,-15);c.moveTo(8,-2);c.lineTo(13,-10);c.stroke();break;
      case'dumpling':c.beginPath();c.moveTo(-13,8);c.quadraticCurveTo(-10,-10,0,-12);c.quadraticCurveTo(10,-10,13,8);c.quadraticCurveTo(0,14,-13,8);c.stroke();c.beginPath();c.moveTo(-8,-3);c.lineTo(-4,1);c.lineTo(0,-4);c.lineTo(4,1);c.lineTo(8,-3);c.stroke();break;
      case'hotpot':c.beginPath();c.moveTo(-11,-2);c.lineTo(-9,11);c.quadraticCurveTo(0,16,9,11);c.lineTo(11,-2);c.closePath();c.stroke();c.beginPath();c.moveTo(-15,2);c.lineTo(-11,4);c.moveTo(11,4);c.lineTo(15,2);c.moveTo(-7,-6);c.bezierCurveTo(-11,-11,-4,-12,-7,-17);c.moveTo(2,-6);c.bezierCurveTo(-2,-11,5,-12,2,-17);c.moveTo(9,-6);c.bezierCurveTo(5,-11,12,-12,9,-17);c.stroke();break;
      case'plate':c.beginPath();c.arc(0,1,13,0,TAU);c.moveTo(-8,5);c.quadraticCurveTo(-2,-5,4,3);c.quadraticCurveTo(7,7,10,-3);c.stroke();c.beginPath();c.moveTo(-2,-6);c.quadraticCurveTo(4,-12,8,-7);c.quadraticCurveTo(3,-5,-2,-6);c.stroke();break;
      case'burger':c.beginPath();c.moveTo(-12,-3);c.quadraticCurveTo(-10,-13,0,-13);c.quadraticCurveTo(10,-13,12,-3);c.closePath();c.stroke();c.beginPath();c.moveTo(-13,0);c.lineTo(13,0);c.moveTo(-11,4);c.lineTo(-5,7);c.lineTo(0,4);c.lineTo(6,7);c.lineTo(11,4);c.moveTo(-11,10);c.quadraticCurveTo(0,14,11,10);c.stroke();break;
      case'salad':bowl();c.beginPath();c.moveTo(-9,-1);c.quadraticCurveTo(-13,-9,-5,-9);c.quadraticCurveTo(-1,-9,0,-2);c.moveTo(0,-2);c.quadraticCurveTo(1,-13,8,-10);c.quadraticCurveTo(13,-6,6,0);c.moveTo(0,-2);c.lineTo(0,-14);c.stroke();break;
      case'sushi':roundedRect(c,-13,-10,11,20,3);c.stroke();roundedRect(c,3,-7,10,17,3);c.stroke();c.beginPath();c.arc(-7.5,-4,2.5,0,TAU);c.arc(8,-2,2,0,TAU);c.stroke();break;
      case'skillet':c.beginPath();c.arc(-2,1,11,0,TAU);c.moveTo(9,1);c.lineTo(16,-5);c.stroke();c.beginPath();c.arc(-3,0,4,0,TAU);c.stroke();c.beginPath();c.moveTo(-8,-12);c.quadraticCurveTo(-11,-16,-7,-18);c.moveTo(0,-12);c.quadraticCurveTo(-3,-16,1,-18);c.stroke();break;
      case'skewers':c.beginPath();c.moveTo(-13,13);c.lineTo(12,-12);c.moveTo(-7,14);c.lineTo(14,-7);c.stroke();c.save();c.rotate(-Math.PI/4);[-7,0,7].forEach(v=>{roundedRect(c,v-3,-6,6,8,2);c.stroke()});c.restore();break;
      case'steak':c.beginPath();c.moveTo(-12,5);c.bezierCurveTo(-15,-5,-6,-13,3,-12);c.bezierCurveTo(13,-11,16,-2,11,7);c.bezierCurveTo(5,16,-7,14,-12,5);c.stroke();c.beginPath();c.arc(5,-4,3,0,TAU);c.moveTo(-7,5);c.quadraticCurveTo(-2,9,4,7);c.stroke();break;
      case'pasta':c.beginPath();c.arc(0,0,13,0,TAU);c.moveTo(-8,1);c.bezierCurveTo(-4,-7,7,-7,7,0);c.bezierCurveTo(7,6,-4,7,-5,2);c.bezierCurveTo(-5,-2,3,-3,3,1);c.stroke();break;
      case'pizza':c.beginPath();c.moveTo(0,-14);c.lineTo(-12,12);c.quadraticCurveTo(0,16,12,12);c.closePath();c.moveTo(-9,7);c.quadraticCurveTo(0,11,9,7);c.stroke();c.beginPath();c.arc(-3,1,2,0,TAU);c.arc(4,5,2,0,TAU);c.stroke();break;
      case'grill':c.beginPath();c.moveTo(-13,2);c.quadraticCurveTo(0,12,13,2);c.moveTo(-10,0);c.lineTo(10,0);c.moveTo(-8,-4);c.lineTo(8,-4);c.moveTo(-5,8);c.lineTo(-8,15);c.moveTo(5,8);c.lineTo(8,15);c.stroke();c.beginPath();c.moveTo(-5,-8);c.quadraticCurveTo(-9,-13,-4,-17);c.moveTo(3,-8);c.quadraticCurveTo(-1,-13,4,-17);c.stroke();break;
    }
    c.restore();
  }
  function renderWheel(){
    const c=layerCtx,w=layer.width,h=layer.height,cx=w/2,cy=h/2,r=w*.39;c.clearRect(0,0,w,h);
    c.beginPath();c.arc(cx,cy,r+32,0,TAU);c.fillStyle='#725524';c.fill();
    c.beginPath();c.arc(cx,cy,r+25,0,TAU);c.fillStyle='#d8bf7b';c.fill();
    c.beginPath();c.arc(cx,cy,r+15,0,TAU);c.fillStyle='#28261f';c.fill();
    c.beginPath();c.arc(cx,cy,r+7,0,TAU);c.fillStyle='#eee0c4';c.fill();
    c.save();c.translate(cx,cy);
    items.forEach((it,i)=>{
      const[name,icon,color]=it,a0=-Math.PI/2+i*arc,a1=a0+arc,mid=a0+arc/2;
      c.beginPath();c.moveTo(0,0);c.arc(0,0,r,a0,a1);c.closePath();c.fillStyle=color;c.fill();
      const shade=c.createRadialGradient(0,0,r*.08,0,0,r);shade.addColorStop(0,'rgba(255,255,255,.1)');shade.addColorStop(.68,'rgba(255,255,255,0)');shade.addColorStop(1,'rgba(0,0,0,.2)');c.fillStyle=shade;c.fill();
      c.strokeStyle='rgba(246,228,190,.56)';c.lineWidth=2;c.stroke();
      c.save();c.rotate(mid);c.translate(r*.72,0);c.rotate(Math.PI/2);c.textAlign='center';c.textBaseline='middle';
      drawIcon(c,icon,0,-29,34);
      c.shadowColor='rgba(0,0,0,.28)';c.shadowBlur=4;c.fillStyle='#fff5df';c.font='600 18px Georgia,"Songti SC","STSong",serif';
      const ls=linesFor(name);if(ls.length===1)c.fillText(ls[0],0,18);else{c.fillText(ls[0],0,12);c.fillText(ls[1],0,32)}c.restore();
    });
    c.restore();
  }
  function draw(){const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);ctx.drawImage(layer,-cx,-cy);ctx.restore()}
  function finish(){
    rotation=norm(rotation);draw();const index=selectedIndex();chosen=items[index];resultEl.textContent=chosen[0];subEl.textContent=chosen[3];courseNoEl.textContent='No. '+String(index+1).padStart(2,'0');shareBtn.classList.add('show');running=false;hasSpun=true;spinBtn.disabled=false;spinBtn.textContent='再转一次';wheelbox.classList.remove('is-spinning');wheelbox.classList.remove('has-result');panel.classList.remove('is-revealed');void panel.offsetWidth;wheelbox.classList.add('has-result');panel.classList.add('is-revealed');
  }
  function spin(){
    if(running)return;running=true;chosen=null;shareBtn.classList.remove('show');wheelbox.classList.remove('has-result');panel.classList.remove('is-revealed');wheelbox.classList.add('is-spinning');spinBtn.disabled=true;spinBtn.textContent=hasSpun?'重新选择中…':'主厨正在选择…';resultEl.textContent='正在决定…';subEl.textContent='请稍候，今日主厨正在斟酌菜单。';courseNoEl.textContent='—';
    const start=rotation,target=start+(6+Math.random()*3)*TAU+Math.random()*TAU;
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){rotation=target;finish();return}
    const t0=performance.now(),duration=3900+Math.random()*350;
    function frame(t){const p=Math.min(1,(t-t0)/duration),e=1-Math.pow(1-p,5),settle=Math.sin(p*Math.PI*6)*Math.pow(p,8)*(1-p)*.035;rotation=start+(target-start)*e+settle;draw();if(p<1)requestAnimationFrame(frame);else finish()}
    requestAnimationFrame(frame);
  }
  async function shareResult(){if(!chosen)return;const text='今天中午吃：'+chosen[0]+'\n'+chosen[3];if(navigator.share){try{await navigator.share({title:'午餐转盘',text});return}catch(e){}}alert(text)}
  spinBtn.addEventListener('click',spin);shareBtn.addEventListener('click',shareResult);renderWheel();draw();
})();
</script>
</body>
